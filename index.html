<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Herbivore</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="gameContainer">
        <div id="bgImage" class="bg-layer"></div>
        <div id="bgImage2" class="bg-layer"></div>
        <div id="sunburstLayer" class="bg-layer">
            <div class="sunburst"></div>
            <div class="sun-center"></div>
        </div>
        <div id="logoContainer">
            <img id="logo" src="./assets/logo.png" alt="logo">
            <img id="logoBlink" src="./assets/logo_blink.png" alt="logo blink">
        </div>
        <div id="slogun" data-text="Healty in a Hurry">Healty in a Hurry</div>
        <button id="fullscreenBtn">Fullscreen</button>
        <div id="layer" class="bg-layer" style="display: none;"></div>
        <!-- "layer" seems unused or implicit? I will stick to adding the egg at the end -->
        <div id="easterEgg">67</div>
    </div>
    <script src="main.js"></script>
</body>

</html>
